<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>Pocket Budget</title><style>:root{font-family:system-ui,sans-serif;color:#edf4ff;background:#0d1420}*{box-sizing:border-box}body{margin:0}header,main,nav{max-width:850px;margin:auto;padding:16px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:22px}button,input,select{font:inherit;border-radius:10px;padding:11px;border:1px solid #39465a}button{background:#26374f;color:white;cursor:pointer}button.active,.primary{background:#397ee8;border-color:#397ee8}input,select{background:#131e2e;color:white;width:100%}label{display:block;margin:10px 0 5px;color:#b6c7dc;font-size:13px}.card{background:#192538;border:1px solid #304058;border-radius:16px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.metric{font-size:clamp(18px,4vw,27px);font-weight:700;overflow-wrap:anywhere}.muted{color:#aabbd1;font-size:13px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.bar{height:9px;border-radius:10px;background:#304057;overflow:hidden;margin:8px 0}.fill{height:100%;background:#51c8a2}.over{background:#ff7c81}.item{padding:12px 0;border-bottom:1px solid #304057}.item:last-child{border:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{padding:7px 10px;font-size:13px}.hidden{display:none}nav{position:sticky;bottom:0;background:#0d1420;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}nav button{font-size:12px;padding:12px 3px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tip{border-left:3px solid #51c8a2;padding:9px 12px;background:#122b32;margin:8px 0}small{color:#b6c7dc}@media(max-width:550px){.grid{grid-template-columns:1fr 1fr}.grid .card:last-child{grid-column:1/-1}.two{grid-template-columns:1fr}header,main{padding:12px}nav{padding:8px}}</style></head><body><header><h1>💸 Pocket Budget</h1><span class="muted">NZD</span></header><main><section id="dashboard"><div class="grid"><div class="card"><small>Income</small><div class="metric" id="income">$0</div></div><div class="card"><small>Expenses</small><div class="metric" id="expenses">$0</div></div><div class="card"><small>Remaining</small><div class="metric" id="remaining">$0</div></div></div><div class="card"><div class="row"><h3>Monthly breakdown</h3><input id="month" type="month" style="max-width:170px"></div><div id="breakdown"></div></div><div class="card"><h3>Spending insights</h3><div id="tips"></div></div></section><section id="add" class="hidden"><div class="card"><h2>Add transaction</h2><form id="transactionForm"><label>Date</label><input id="date" type="date" required><label>Type</label><select id="type"><option value="expense">Expense</option><option value="income">Income</option></select><label>Category</label><select id="category" required></select><label>Amount (NZ$)</label><input id="amount" type="number" min="0.01" step="0.01" required><label>Note</label><input id="note" maxlength="150"><p><button class="primary" type="submit">Save transaction</button></p></form></div></section><section id="categories" class="hidden"><div class="card"><h2>Categories & monthly budgets</h2><form id="categoryForm"><input type="hidden" id="editId"><label>Name</label><input id="catName" required maxlength="50"><label>Type</label><select id="catType"><option value="expense">Expense</option><option value="income">Income</option></select><label>Monthly budget / target</label><input id="catBudget" type="number" min="0" step="0.01" value="0" required><p class="actions"><button class="primary" type="submit">Save category</button><button type="button" id="cancelEdit">Clear</button></p></form></div><div class="card" id="categoryList"></div></section><section id="reports" class="hidden"><div class="card"><h2>Transactions</h2><div id="transactions"></div></div><div class="card"><h3>Backup and restore</h3><p class="muted">Your data stays in this browser. Export regularly to avoid losing it.</p><div class="actions"><button id="export">Export JSON</button><button id="import">Import JSON</button><input id="file" type="file" accept=".json,application/json" class="hidden"><button id="reset">Reset all</button></div></div></section></main><nav><button data-tab="dashboard" class="active">Dashboard</button><button data-tab="add">Add</button><button data-tab="categories">Categories</button><button data-tab="reports">Reports</button></nav><script>
(()=>{'use strict';const $=id=>document.getElementById(id),key='pocket_budget_fixed_v1',uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36),money=n=>new Intl.NumberFormat('en-NZ',{style:'currency',currency:'NZD'}).format(n||0),localDate=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');let state;const defaults=()=>({categories:[['Pay','income',10177],['Groceries','expense',1500],['Housing','expense',0],['Utilities','expense',450],['Childcare','expense',1473],['Transport','expense',250],['Insurance','expense',350],['Entertainment','expense',200],['Savings','expense',1000]].map(([name,type,budget])=>({id:uid(),name,type,budget})),transactions:[]});try{state=JSON.parse(localStorage.getItem(key))||defaults();if(!Array.isArray(state.categories)||!Array.isArray(state.transactions))throw Error()}catch{state=defaults()}const save=()=>{try{localStorage.setItem(key,JSON.stringify(state))}catch{alert('Browser storage unavailable. Export your data to keep it safe.')}render()};$('month').value=localDate(new Date()).slice(0,7);$('date').value=localDate(new Date());function el(tag,text){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e}function categoryOptions(){const old=$('category').value;$('category').replaceChildren();state.categories.filter(c=>c.type===$('type').value).forEach(c=>{const o=el('option',c.name);o.value=c.id;$('category').append(o)});if([...$('category').options].some(o=>o.value===old))$('category').value=old}function render(){categoryOptions();const month=$('month').value,tx=state.transactions.filter(t=>t.date.slice(0,7)===month),inc=tx.filter(t=>t.type==='income').reduce((a,t)=>a+t.amount,0),exp=tx.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amount,0);$('income').textContent=money(inc);$('expenses').textContent=money(exp);$('remaining').textContent=money(inc-exp);$('breakdown').replaceChildren();$('tips').replaceChildren();let warnings=0;state.categories.filter(c=>c.type==='expense').forEach(c=>{const spent=tx.filter(t=>t.type==='expense'&&t.categoryId===c.id).reduce((a,t)=>a+t.amount,0);const wrap=el('div');wrap.className='item';const head=el('div');head.className='row';head.append(el('strong',c.name),el('span',`${money(spent)} / ${c.budget?money(c.budget):'No limit'}`));wrap.append(head);const bar=el('div');bar.className='bar';const fill=el('div');fill.className='fill'+(c.budget&&spent>c.budget?' over':'');fill.style.width=(c.budget?Math.min(100,spent/c.budget*100):spent?100:0)+'%';bar.append(fill);wrap.append(bar);$('breakdown').append(wrap);if(c.budget>0&&spent>c.budget){tip(`${c.name} is ${money(spent-c.budget)} over budget.`);warnings++}else if(c.budget>0&&spent>=c.budget*.9){tip(`${c.name} has used ${Math.round(spent/c.budget*100)}% of its budget.`);warnings++}});if(inc>0&&exp>inc){tip(`Expenses exceed recorded income by ${money(exp-inc)}.`);warnings++}if(!warnings)tip(tx.length?'No categories are currently over budget.':'Add some transactions to get spending insights.');$('categoryList').replaceChildren();state.categories.forEach(c=>{const line=el('div');line.className='item row';const info=el('div');info.append(el('strong',c.name),el('div',`${c.type} · ${money(c.budget)} / month`));const acts=el('div');acts.className='actions';const edit=el('button','Edit');edit.onclick=()=>{$('editId').value=c.id;$('catName').value=c.name;$('catType').value=c.type;$('catBudget').value=c.budget;window.scrollTo(0,0)};const del=el('button','Delete');del.onclick=()=>{if(!confirm(`Delete ${c.name} and its transactions?`))return;state.categories=state.categories.filter(x=>x.id!==c.id);state.transactions=state.transactions.filter(t=>t.categoryId!==c.id);save()};acts.append(edit,del);line.append(info,acts);$('categoryList').append(line)});$('transactions').replaceChildren();[...state.transactions].sort((a,b)=>b.date.localeCompare(a.date)).forEach(t=>{const line=el('div');line.className='item row';const c=state.categories.find(c=>c.id===t.categoryId);const info=el('div');info.append(el('strong',`${c?.name||'Unknown'} · ${money(t.amount)}`),el('div',`${t.date}${t.note?' · '+t.note:''}`));const del=el('button','Delete');del.onclick=()=>{if(confirm('Delete this transaction?')){state.transactions=state.transactions.filter(x=>x.id!==t.id);save()}};line.append(info,del);$('transactions').append(line)})}function tip(s){const d=el('div',s);d.className='tip';$('tips').append(d)}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('main>section').forEach(s=>s.classList.add('hidden'));$(b.dataset.tab).classList.remove('hidden');document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b))});$('type').onchange=categoryOptions;$('month').onchange=render;$('transactionForm').onsubmit=e=>{e.preventDefault();const amount=Number($('amount').value);if(!(amount>0)||!$('category').value)return alert('Enter a valid amount and category.');state.transactions.push({id:uid(),date:$('date').value,type:$('type').value,categoryId:$('category').value,amount,note:$('note').value.trim()});$('amount').value='';$('note').value='';save();document.querySelector('[data-tab="dashboard"]').click()};function clearCategory(){$('editId').value='';$('catName').value='';$('catBudget').value='0';$('catType').value='expense'}$('cancelEdit').onclick=clearCategory;$('categoryForm').onsubmit=e=>{e.preventDefault();const name=$('catName').value.trim(),type=$('catType').value,budget=Number($('catBudget').value),id=$('editId').value;if(!name||budget<0||!Number.isFinite(budget))return;if(state.categories.some(c=>c.id!==id&&c.name.toLowerCase()===name.toLowerCase()&&c.type===type))return alert('Category already exists.');if(id){const c=state.categories.find(c=>c.id===id);if(c){c.name=name;c.budget=budget;if(c.type!==type&&state.transactions.some(t=>t.categoryId===id))return alert('Cannot change the type of a category with transactions.');c.type=type}}else state.categories.push({id:uid(),name,type,budget});clearCategory();save()};$('export').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download='pocket-budget-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data.categories)||!Array.isArray(data.transactions)||data.categories.some(c=>typeof c.id!=='string'||typeof c.name!=='string'||!['income','expense'].includes(c.type)||!Number.isFinite(c.budget))||data.transactions.some(t=>typeof t.id!=='string'||typeof t.date!=='string'||!Number.isFinite(t.amount)||!['income','expense'].includes(t.type)))throw Error();if(confirm('Replace current data with this backup?')){state=data;save()}}catch{alert('Invalid backup file.')}e.target.value=''};$('reset').onclick=()=>{if(confirm('Permanently erase all budget data?')){state=defaults();save()}};render()})();
</script></body></html>
